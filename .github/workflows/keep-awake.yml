name: Keep Supabase awake

# Supabase pauses a free project after 7 days with no database activity, so we
# run a real query against it every couple of days.
#
# There is no repo-keepalive step here: GitHub only auto-disables scheduled
# workflows in *public* repositories after 60 days of inactivity, and this repo
# is private. If it is ever made public again, that rule applies and this
# workflow will need a step that keeps the repo active.

on:
  schedule:
    # Every 2 days at 06:00 UTC — comfortable margin on the 7-day pause window.
    - cron: '0 6 */2 * *'
  workflow_dispatch:        # also runnable by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Must be a query against a real table: a bare request to the project URL
      # can be answered by the API gateway without ever reaching Postgres, which
      # would not reset the inactivity clock. `players` has a public SELECT
      # policy, so the anon key is enough.
      #
      # `select=*` rather than a named column on purpose — this job runs
      # unattended for months, and it should not break if a column is renamed.
      - name: Query Postgres
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Check the secrets first. Without this, a missing URL surfaces only as
          # `curl: (3) URL using bad/illegal format`, which is a confusing way to
          # find out a secret is unset.
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is empty or not set."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is empty or not set."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::SUPABASE_URL must start with https:// (value is ${#SUPABASE_URL} chars). Paste only the URL, not the whole NEXT_PUBLIC_SUPABASE_URL=... line."
              exit 1
              ;;
          esac

          # Tolerate a trailing slash on the secret.
          base="${SUPABASE_URL%/}"

          code=$(curl -sS -o response.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$base/rest/v1/players?select=*&limit=1")

          echo "REST status: $code"

          if [ "$code" = "200" ]; then
            # Body is discarded on success — no reason to put player names in a log.
            echo "Database reached — pause timer reset."
            exit 0
          fi

          # On failure PostgREST returns a JSON error that names the exact
          # problem (bad column, missing table, RLS denial). Show it.
          echo "Response body:"
          cat response.json || true
          echo

          case "$code" in
            400) echo "::error::Bad request (400) — the query is invalid for this schema; see the body above." ;;
            401|403) echo "::error::Rejected ($code) — SUPABASE_ANON_KEY is wrong, or the RLS policy on players changed." ;;
            404) echo "::error::Not found (404) — check the project URL, or whether the players table still exists." ;;
            5*) echo "::error::Supabase returned $code — likely a transient outage; the next run will retry." ;;
            *) echo "::error::Unexpected status $code." ;;
          esac
          exit 1
