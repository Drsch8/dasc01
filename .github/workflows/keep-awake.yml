name: Keep Supabase awake

# Supabase pauses a free project after 7 days with no database activity, so we
# run a real query against it every couple of days. GitHub in turn disables
# scheduled workflows in a public repo after 60 days with no repository
# activity, so the last step pushes an empty commit if the repo has gone quiet.

on:
  schedule:
    # Every 2 days at 06:00 UTC — comfortable margin on the 7-day pause window.
    - cron: '0 6 */2 * *'
  workflow_dispatch:        # also runnable by hand from the Actions tab

permissions:
  contents: write           # needed only by the keepalive commit below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Touch the database ─────────────────────────────────────────────
      # Must be a query against a real table: a bare request to the project URL
      # can be answered by the API gateway without ever reaching Postgres, which
      # would not reset the inactivity clock. `players` has a public SELECT
      # policy, so the anon key is enough.
      - name: Query Postgres
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/players?select=name&limit=1")
          echo "REST status: $code"
          # Response body is discarded on purpose — Actions logs are public on a
          # public repo, and there is no reason to print player names into them.
          [ "$code" = "200" ]

      # ── 2. Keep the workflow itself from being auto-disabled ──────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full clone; pushing from a shallow one can be rejected

      - name: Reset the 60-day scheduled-workflow clock
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Newest commit is $age day(s) old."
          if [ "$age" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
            echo "Pushed a keepalive commit."
          else
            echo "Repo is active; nothing to do."
          fi
